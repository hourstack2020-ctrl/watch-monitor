<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>登入｜鐘點站監控</title><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/app-icon-180.png"><meta name="theme-color" content="#152337"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="鐘點站監控"><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#f5f6f8;color:#152337;font:16px system-ui;padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom))}main{width:100%;max-width:400px;background:white;padding:30px 24px;border:1px solid #e0e6ee;border-radius:20px;box-shadow:0 8px 32px #1523370a}img{width:72px;height:72px;border-radius:16px}h1{font-size:25px;margin:18px 0 8px}p{color:#718095;line-height:1.6}label{display:block;margin:18px 0 8px}input,button{font:inherit;width:100%;min-height:50px;border-radius:10px;padding:12px}input{border:1px solid #c8d2df;color:#152337;background:white}button{border:0;background:#152337;color:white;margin-top:24px;font-weight:650;cursor:pointer}button:disabled{opacity:.6}#message{color:#a23b2b;font-size:14px;min-height:22px}input:focus-visible,button:focus-visible{outline:3px solid #7da7ce;outline-offset:3px}</style></head><body><main><img src="/app-icon-180.png" alt="HS"><h1>鐘點站名錶監控</h1><p>請登入以查看商品、比價與月紀錄。</p><form id="loginForm"><label for="username">帳號</label><input id="username" name="username" placeholder="請輸入帳號" autocomplete="username" autocapitalize="none" spellcheck="false" required><label for="password">密碼</label><input id="password" name="password" type="password" autocomplete="current-password" required><button id="submit" type="submit">登入</button><p id="message" role="status" aria-live="polite"></p></form></main><script>document.getElementById('loginForm').addEventListener('submit',async event=>{event.preventDefault();const button=document.getElementById('submit'),message=document.getElementById('message');button.disabled=true;message.textContent='登入中…';try{const r=await fetch('/api/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-Watch-Monitor':'1'},body:JSON.stringify({username:document.getElementById('username').value.trim(),password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'登入失敗');location.replace('/'+location.hash)}catch(e){message.textContent=e.message||'連線失敗，請稍後重試';button.disabled=false}});</script></body></html>
