services:
  - type: web
    name: hourstack-watch-monitor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 app:app
    healthCheckPath: /ready
    region: singapore
    envVars:
      - key: SKIP_DB_INIT
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
  - type: cron
    name: hourstack-watch-crawler
    runtime: python
    plan: starter
    schedule: "0 */6 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py crawl
    region: singapore
    envVars:
      - key: SKIP_DB_INIT
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: DATABASE_URL
        sync: false
      - key: MAX_PAGES_PER_SITE
        value: "200"
      - key: CRAWL_DELAY_SECONDS
        value: "2"
