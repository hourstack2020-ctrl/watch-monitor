<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>同業名錶價格監控</title><style>body{margin:0;background:#f5f6f8;color:#192333;font:15px system-ui,'Noto Sans TC',sans-serif}header{background:#152337;color:white;padding:28px max(22px,5vw)}h1{margin:0;font-size:26px}main{max-width:1400px;margin:auto;padding:24px}section{background:white;border:1px solid #e2e6ec;border-radius:15px;padding:20px;margin-bottom:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat strong{display:block;font-size:27px;margin-top:8px}.filters{display:flex;flex-wrap:wrap;gap:10px}input,select,button{font:inherit;padding:11px;border:1px solid #ccd3dd;border-radius:9px;background:white}input{min-width:190px;flex:2}select{flex:1;min-width:125px}button{cursor:pointer;background:#152337;color:white;border:0}button:disabled{opacity:.5}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:1050px}th,td{text-align:left;border-bottom:1px solid #e8ebef;padding:13px 10px}th{background:#f4f6f9;white-space:nowrap}td a{color:#215f9b;text-decoration:none}.muted{color:#718095;font-size:13px}.price{font-weight:700;white-space:nowrap}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.tag{display:inline-block;padding:4px 8px;border-radius:6px;background:#edf1f6}#status{margin-top:9px;color:#bfcbdc;font-size:13px}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}main{padding:12px}header{padding:20px}h1{font-size:22px}}.watch-photo{display:block;width:100px;height:78px;object-fit:contain;background:#f1f3f6;border-radius:8px}@media(max-width:650px){.watch-photo{width:78px;height:65px}}</style></head><body><header><div class="top"><div><div style="letter-spacing:2px;font-size:12px;color:#a6bad0">WATCH MARKET INTELLIGENCE</div><h1>同業名錶價格監控</h1><div id="status">等待載入</div></div><button id="run" onclick="crawl()">立即更新商品</button></div></header><main><div class="stats"><section class="stat">商品筆數<strong id="count">0</strong></section><section class="stat">監控網站<strong>3</strong></section><section class="stat">目前顯示<strong id="visible">0</strong></section></div><section><div class="filters"><input id="search" placeholder="搜尋商品名稱、品牌、型號" oninput="page=1;render()"><select id="site" onchange="page=1;render()"><option value="">全部網站</option><option>永生</option><option>玩錶舍</option><option>雷達站</option></select><select id="brand" onchange="page=1;render()"><option value="">全部品牌</option></select><select id="condition" onchange="page=1;render()"><option value="">全部錶況</option><option value="未使用">未使用</option><option value="9成9">9成9新</option><option value="9成8">9成8新</option><option value="9成5">9成5新</option></select><select id="sort" onchange="page=1;render()"><option value="new">最近更新</option><option value="low">價格低到高</option><option value="high">價格高到低</option><option value="model">型號排序</option></select></div></section><section><div class="top"><h2 style="font-size:18px">商品列表</h2><button onclick="exportCSV()">匯出 CSV</button></div><div class="scroll"><table><thead><tr><th>圖片</th><th>來源</th><th>商品</th><th>品牌</th><th>型號</th><th>年份*</th><th>錶況</th><th>售價</th><th>變動</th><th>更新</th><th>價格歷史</th><th>連結</th></tr></thead><tbody id="body"></tbody></table></div><div class="top" style="margin-top:16px"><button id="prevPage" onclick="page--;render()">上一頁</button><span id="pageLabel" class="muted"></span><button id="nextPage" onclick="page++;render()">下一頁</button></div><p class="muted">* 年份依商品文字提取，通常是保卡／保單年份，非必然為製造年份。價格為刊登價，並非成交價。空白代表原站未提供或無法辨識。</p></section></main><dialog id="historyDialog" style="max-width:600px;width:85%;border:1px solid #ccd3dd;border-radius:14px"><h2>歷史價格</h2><div id="historyBody"></div><p><button onclick="$('historyDialog').close()">關閉</button></p></dialog><script>let all=[],shown=[],page=1;const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function showHistory(i){const x=all[i];$('historyBody').textContent='載入中…';$('historyDialog').showModal();try{const r=await fetch('/api/history?url='+encodeURIComponent(x.url));if(!r.ok)throw Error('無法取得歷史價格');const rows=await r.json();$('historyBody').innerHTML='<p>'+esc(x.title)+'</p>'+ (rows.length?rows.map(h=>'<p>'+esc(new Date(h.checked).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}))+'　NT$ '+Number(h.price).toLocaleString('en-US')+'</p>').join(''):'尚無數字價格紀錄')}catch(e){$('historyBody').textContent=e.message}}async function load(){try{all=await(await fetch('/api/watches')).json();const selectedBrand=$('brand').value;const brands=[...new Set(all.map(x=>x.brand))].sort();$('brand').innerHTML='<option value="">全部品牌</option>'+brands.map(x=>`<option>${esc(x)}</option>`).join('');$('brand').value=brands.includes(selectedBrand)?selectedBrand:'';$('count').textContent=all.length;render();const s=await(await fetch('/api/status')).json();$('status').textContent=(s.running?'更新中…':s.last_run?'上次更新：'+new Date(s.last_run).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}):'尚未爬取，請點「立即更新商品」')+(s.error?'｜部分網站錯誤：'+s.error:'');$('run').disabled=s.running;if(s.running)setTimeout(load,4000)}catch(e){$('status').textContent='連線失敗：'+e.message}}function render(){let q=$('search').value.trim().toLowerCase(),site=$('site').value,brand=$('brand').value,cond=$('condition').value;shown=all.filter(x=>(!q||[x.title,x.brand,x.model].join(' ').toLowerCase().includes(q))&&(!site||x.site===site)&&(!brand||x.brand===brand)&&(!cond||x.condition.includes(cond)));let sort=$('sort').value;shown.sort((a,b)=>sort==='low'?(a.price??Infinity)-(b.price??Infinity):sort==='high'?(b.price??-1)-(a.price??-1):sort==='model'?a.model.localeCompare(b.model):b.updated.localeCompare(a.updated));const pages=Math.max(1,Math.ceil(shown.length/100));page=Math.max(1,Math.min(page,pages));const visible=shown.slice((page-1)*100,page*100);$('visible').textContent=visible.length;$('pageLabel').textContent='第 '+page+' / '+pages+' 頁，共 '+shown.length+' 筆';$('prevPage').disabled=page===1;$('nextPage').disabled=page===pages;$('body').innerHTML=visible.map(x=>`<tr><td>${x.image_url?`<a href="${esc(x.image_url)}" target="_blank" rel="noopener noreferrer"><img class="watch-photo" src="${esc(x.image_url)}" alt="${esc(x.model||x.brand)} 商品圖片" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.hidden=true;this.parentElement.nextElementSibling.hidden=false"></a><span class="muted" hidden>圖片暫無</span>`:'<span class="muted">圖片暫無</span>'}</td><td><span class="tag">${esc(x.site)}</span></td><td style="min-width:240px">${esc(x.title)}</td><td>${esc(x.brand)}</td><td><b>${esc(x.model||'—')}</b></td><td>${esc(x.year||'—')}</td><td>${esc(x.condition||'—')}</td><td class="price">${x.price!==null?'NT$ '+Number(x.price).toLocaleString('en-US'):esc(x.price_text)}</td><td>${esc(({new:"新上架",price_up:"漲價",price_down:"降價",unchanged:"無變動",possibly_removed:"疑似下架",returned:"重新上架",changed:"資料變更"})[x.status]||"—")}</td><td class="muted">${esc(new Date(x.updated).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}))}</td><td><button onclick="showHistory(${all.indexOf(x)})">查看歷史</button></td><td><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">查看商品 ↗</a></td></tr>`).join('')||'<tr><td colspan="12">尚無資料，請先更新商品</td></tr>'}async function crawl(){const r=await fetch('/api/crawl',{method:'POST',headers:{'X-Watch-Monitor':'1'}});const data=await r.json();if(!r.ok){alert(data.error||'更新失敗');return}$('status').textContent='更新已開始，請稍候';$('run').disabled=true;setTimeout(load,4000)}function exportCSV(){let keys=['site','title','brand','model','year','condition','price','price_text','updated','url'];let lines=[['來源','商品','品牌','型號','年份','錶況','價格','價格文字','更新時間','網址'],...shown.map(x=>keys.map(k=>x[k]??''))];let csv='\ufeff'+lines.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='watch_prices.csv';a.click();URL.revokeObjectURL(a.href)}load()</script></body></html>
